[tool.poetry]
name = "django-multiverse"
version = "2.0.0"
description = "Django Multiverse: database-per-tenant multi-tenancy for Django"
authors = ["Daniel Pinto <dmp593@gmail.com>"]
license = "MIT"
repository = "https://github.com/dmp593/django-multiverse"
readme = "README.md"
package-mode = true
keywords = ["Django", "Multiverse", "Multi-Tenancy", "Tenants"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed"
]

# `include = "multiverse"` rather than a glob over *.py: a glob silently drops
# every non-Python file, which would have quietly excluded the py.typed marker.
packages = [
    { include = "multiverse" }
]

[tool.poetry.dependencies]
python = "^3.10"
Django = ">=5.0,<6.0"
django-timestampable = "^1.1.6"
psycopg = { version = "^3.2.1", optional = true }
djangorestframework = { version = "^3.15", optional = true }
django-q2 = { version = "^1.6.2", optional = true }

[tool.poetry.group.dev.dependencies]
ruff = "^0.6"

[tool.poetry.extras]
postgres = ["psycopg"]
django-q2 = ["django-q2"]
drf = ["djangorestframework"]
all = ["psycopg", "django-q2", "djangorestframework"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "DJ"]
ignore = [
    # Assertions in the test suite are the point of the test suite.
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# Fixture models exist to be routed, not displayed.
"tests/apps/*/models.py" = ["DJ008"]
# Migrations are generated and, once released, are a historical record.
"multiverse/migrations/*" = ["E501", "I001"]
"tests/apps/*/migrations/*" = ["E501", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["multiverse"]
